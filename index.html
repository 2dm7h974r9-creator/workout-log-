<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#15181d; --ink2:#5b636e; --muted:#8a929c;
  --line:#e4e7ec; --accent:#2563eb; --accent-ink:#ffffff; --accent-soft:#e8efff;
  --danger:#c62828; --good:#1b7f3b; --input:#f1f3f6;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1115; --card:#181b21; --ink:#eef0f3; --ink2:#a9b0ba; --muted:#7c848f;
    --line:#2a2f37; --accent:#6b9bff; --accent-ink:#0b1020; --accent-soft:#1d2840;
    --danger:#ff6b6b; --good:#4cc47a; --input:#22262e;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
.wrap{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}
h2{font-size:17px;margin:0 0 10px}
.sub{color:var(--ink2);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.row{display:flex;gap:8px;align-items:center}
.row.wrapr{flex-wrap:wrap}
.grow{flex:1}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;cursor:pointer;
  background:var(--input);color:var(--ink)}
button.primary{background:var(--accent);color:var(--accent-ink);font-weight:600}
button.ghost{background:transparent;color:var(--accent);padding:8px 10px}
button.danger{color:var(--danger);background:transparent;padding:8px 10px}
button.big{width:100%;padding:14px;font-size:17px}
button:disabled{opacity:.5}
input,select{font:inherit;color:var(--ink);background:var(--input);border:1px solid transparent;
  border-radius:10px;padding:10px 12px;width:100%}
input:focus,select:focus{outline:none;border-color:var(--accent)}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ex-name{font-weight:600;font-size:17px}
.prev{color:var(--muted);font-size:13px;margin-top:2px}
.sets{margin-top:10px}
.set{display:grid;grid-template-columns:28px 1fr 18px 1fr 36px;gap:6px;align-items:center;margin-bottom:6px}
.set .n{color:var(--muted);font-size:14px;text-align:center}
.set .x{color:var(--muted);text-align:center}
.set input{text-align:center;padding:9px 6px}
.set .del{background:transparent;color:var(--muted);padding:6px;font-size:18px}
.lbls{display:grid;grid-template-columns:28px 1fr 18px 1fr 36px;gap:6px;color:var(--muted);font-size:12px;text-align:center}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav.tabs button{flex:1;background:transparent;color:var(--muted);font-size:12px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent)}
.status{font-size:13px;color:var(--ink2);background:var(--accent-soft);border-radius:10px;padding:8px 12px;margin-top:8px}
.status.warn{background:transparent;border:1px solid var(--line)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.tile .k{font-size:12px;color:var(--ink2)}
.tile .v{font-size:20px;font-weight:700;margin-top:2px}
.tile .d{font-size:12px;color:var(--muted)}
.seg{display:flex;background:var(--input);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;background:transparent;padding:7px 6px;font-size:14px;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chartbox{position:relative;height:240px;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 4px;border-bottom:1px solid var(--line)}
th{color:var(--ink2);font-weight:500;font-size:13px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.hist-ex{font-size:14px;margin:3px 0}
.hist-ex b{font-weight:600}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:85vh;border-radius:18px 18px 0 0;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
.sheet .list{overflow:auto;margin-top:10px;flex:1}
.pick{display:block;width:100%;text-align:left;background:transparent;border-bottom:1px solid var(--line);border-radius:0;padding:12px 4px}
.pick small{color:var(--muted);margin-left:6px}
.grp{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:12px 4px 4px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90%}
.svgchart{position:relative;height:auto;margin-top:10px}
.svgchart svg{display:block;width:100%;height:auto;overflow:visible}
.svgchart .cap{font-size:13px;color:var(--ink2);text-align:center;min-height:18px;margin-top:4px}
.hitpt{cursor:pointer}
.tplrow{display:flex;align-items:center;gap:4px;padding:10px 0;border-top:1px solid var(--line)}
.tplrow:first-of-type{border-top:0}
.tplrow .prev{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tplrow .primary{padding:8px 14px}
.plan{color:var(--accent)}
.pr{color:var(--good);font-weight:600;font-size:13px}
.star{background:transparent;color:var(--muted);padding:4px;line-height:0;flex:none}
.star.on{color:#e0a400}
.pickrow{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.pickrow .pick{border-bottom:0;flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:15px}
</style>
</head>

  <h1 id="title">Workout</h1>

  <button data-tab="weight"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M9 10a3 3 0 0 1 6 0M12 10l1.5-2"/></svg>Body weight</button>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = parseFloat(String(v ?? "").replace(",", ".")); return isFinite(n) ? n : null; };
const fmt = n => (Math.round(n * 10) / 10).toLocaleString("en-US");
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const fdate = iso => { const d = new Date(iso + "T12:00:00"); return `${WDAYS[d.getDay()]}, ${MONTHS[d.getMonth()]} ${d.getDate()}` + (d.getFullYear() !== new Date().getFullYear() ? `, ${d.getFullYear()}` : ""); };
const fshort = iso => { const d = new Date(iso + "T12:00:00"); return `${MONTHS[d.getMonth()]} ${d.getDate()}`; };
const e1rm = (w, r) => (!w || !r) ? 0 : (r === 1 ? w : w * (1 + r / 30));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
function toast(msg){ document.querySelectorAll(".toast").forEach(x => x.remove()); const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ---------- state ---------- */
const S = {
  tab: "log", docs: new Map(), col: null, mode: "loading",
  draft: lsGet(LS_DRAFT) || null, tdraft: lsGet(LS_TDRAFT) || null, progEx: null, progMetric: "e1rm", chart: null
};
const workouts = () => [...S.docs.entries()].filter(([,b]) => b.kind === "workout")
  .map(([id,b]) => ({id, ...b})).sort((a,b) => (b.date + (b.created||"")).localeCompare(a.date + (a.created||"")));
const bws = () => [...S.docs.entries()].filter(([,b]) => b.kind === "bw")
  .map(([id,b]) => ({id, ...b})).sort((a,b) => a.date.localeCompare(b.date));
const settings = () => S.docs.get("settings") || {};
const templates = () => [...S.docs.entries()].filter(([,b]) => b.kind === "template")
  .map(([id,b]) => ({id, ...b})).sort((a,b) => (a.created||"").localeCompare(b.created||""));
const prefs = () => ({autoBackup: true, ...(lsGet(LS_PREF) || {})});
const setPref = (k, v) => lsSet(LS_PREF, {...prefs(), [k]: v});
const ago = iso => { const n = Math.floor((Date.now() - new Date(iso)) / 864e5); return n <= 0 ? "today" : n === 1 ? "yesterday" : `${n} days ago`; };
const planText = sets => sets.map(s => num(s.w) ? `${fmt(num(s.w))}×${num(s.r) || "?"}` : `${num(s.r) || "?"} reps`).join(", ");
const customEx = () => settings().custom || [];
const favs = () => settings().favorites || [];
const isFav = ex => favs().includes(ex);
function allExercises(){
  const used = new Set(); workouts().forEach(w => w.items.forEach(i => used.add(i.ex)));
  const preset = new Set(Object.values(PRESETS).flat());
  return {used, preset, custom: [...new Set([...customEx(), ...[...used].filter(e => !preset.has(e))])]};
}
const useCounts = () => { const c = {}; workouts().forEach(w => w.items.forEach(i => c[i.ex] = (c[i.ex]||0) + 1)); return c; };

/* ---------- storage ---------- */
async function save(id, body){
  if (S.mode === "cloud") {
    try { await S.col.doc(id).set(body); }
    catch (e) {
      if (e && e.code === "unavailable") { await new Promise(r => setTimeout(r, 600 + Math.random()*600)); await S.col.doc(id).set(body); }
      else { toast(e && e.code === "quota_exceeded" ? "Storage is full" : "Couldn't save"); throw e; }
    }
  } else { S.docs.set(id, body); persistLocal(); render(); }
}
async function remove(id){
  if (S.mode === "cloud") { try { await S.col.doc(id).delete(); } catch { toast("Couldn't delete"); } }
  else { S.docs.delete(id); persistLocal(); render(); }
}
let settingsBusy = Promise.resolve();
function saveSettings(patch){
  settingsBusy = settingsBusy.then(() => save("settings", {...settings(), kind: "settings", custom: customEx(), favorites: favs(), ...patch(settings())}).catch(() => {}));
  return settingsBusy;
}
function persistLocal(){ lsSet(LS_DATA, Object.fromEntries(S.docs)); }
function useLocal(note){
  S.mode = "local";
  const d = lsGet(LS_DATA) || {}; S.docs = new Map(Object.entries(d));
  setStatus(note, true); render();
}
function setStatus(msg, warn){ $("#status").innerHTML = msg ? `<div class="status ${warn ? "warn" : ""}">${esc(msg)}</div>` : ""; }

function initStore(){
  useLocal("");
  if (!lsGet(LS_DATA) && !navigator.storage) return;
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}
}

/* ---------- draft ---------- */
function setDraft(d){ S.draft = d; if (d) lsSet(LS_DRAFT, d); else { try { localStorage.removeItem(LS_DRAFT); } catch {} } }
function setTDraft(d){ S.tdraft = d; if (d) lsSet(LS_TDRAFT, d); else { try { localStorage.removeItem(LS_TDRAFT); } catch {} } }
const active = () => S.tdraft || S.draft;
function saveActive(){ S.tdraft ? setTDraft(S.tdraft) : setDraft(S.draft); }
function ensureDraft(){ if (!S.draft) setDraft({date: today(), items: []}); return S.draft; }
function lastSession(ex, excludeId){
  for (const w of workouts()) { if (w.id === excludeId) continue; const it = w.items.find(i => i.ex === ex); if (it && it.sets.length) return {date: w.date, sets: it.sets}; }
  return null;
}
function bestE1(ex, excludeId){
  let b = 0; workouts().forEach(w => { if (w.id === excludeId) return; w.items.forEach(i => { if (i.ex === ex) i.sets.forEach(s => b = Math.max(b, e1rm(s.w, s.r))); }); }); return b;
}
const setsText = sets => sets.map(s => `${fmt(s.w || 0)}×${s.r || 0}`).join(", ");
const starBtn = ex => `<button class="star ${isFav(ex) ? "on" : ""}" data-act="fav" data-ex="${esc(ex)}" aria-label="${isFav(ex) ? "Remove from favorites" : "Add to favorites"}" title="${isFav(ex) ? "Remove from favorites" : "Add to favorites"}">${STAR(isFav(ex))}</button>`;

/* ---------- views ---------- */
const TITLES = {log:"Workout", history:"History", progress:"Progress", weight:"Body weight"};
function render(){
  $("#title").textContent = TITLES[S.tab];
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === S.tab));
  if (S.chart) { S.chart.destroy(); S.chart = null; }
  const v = $("#view");
  if (S.mode === "loading") { $("#subtitle").textContent = ""; v.innerHTML = `<div class="empty">Loading…</div>`; return; }
  ({log: renderLog, history: renderHistory, progress: renderProgress, weight: renderWeight})[S.tab](v);
  if ($("#plist")) fillPicker();
}

function renderLog(v){
  if (S.tdraft) return renderTemplateEditor(v);
  const d = S.draft;
  $("#subtitle").textContent = d ? (d.id ? "Editing a saved workout" : d.tplName ? `From template: ${d.tplName}` : "New workout") : "Log your sets right at the gym";
  if (!d) {
    const last = workouts()[0];
    const f = favs();
    v.innerHTML = `<div class="card"><button class="primary big" data-act="start">Start workout</button>
      ${last ? `<button class="big" style="margin-top:8px" data-act="repeat" data-id="${last.id}">Repeat last workout (${esc(fshort(last.date))})</button>` : ""}</div>
      ${backupNag()}
      <div class="card"><div class="ex-head" style="align-items:center"><h2 style="margin:0">Templates</h2><button class="ghost" data-act="newtpl">+ New template</button></div>
      ${templates().length ? templates().map(t => `<div class="tplrow"><div class="grow" style="min-width:0"><div class="ex-name">${esc(t.name)}</div>
        <div class="prev">${t.items.map(i => esc(i.ex)).join(" · ")}</div></div>
        <button class="ghost" data-act="edittpl" data-id="${t.id}">Edit</button><button class="primary" data-act="starttpl" data-id="${t.id}">Start</button></div>`).join("")
      : `<div class="sub" style="margin-top:6px">Plan your workouts in advance — e.g. “Push day”, “Legs”, “Upper body” — and start one with a single tap.</div>`}</div>
      <div class="card"><h2>★ Favorites</h2>
      ${f.length ? `<div class="sub" style="margin-bottom:8px">Tap one to start a workout with it</div><div class="chips">${f.map(e => `<button class="chip" data-act="quick" data-ex="${esc(e)}">${esc(e)}</button>`).join("")}</div>
        <button class="ghost" data-act="quickall" style="margin-top:6px;padding-left:0">Start with all favorites</button>`
      : `<div class="sub">Tap the star next to any exercise to add it here for one-tap access.</div>`}</div>
      ${last ? "" : `<div class="empty">No workouts yet. Tap “Start workout”, add an exercise and log the weight and reps of every set.</div>`}`;
    return;
  }
  let html = `<div class="card"><label class="sub">Date</label><input type="date" data-f="date" value="${esc(d.date)}" style="margin-top:4px"></div>`;
  d.items.forEach((it, ii) => {
    const prev = lastSession(it.ex, d.id);
    const best = bestE1(it.ex, d.id);
    const curBest = Math.max(0, ...it.sets.map(s => e1rm(num(s.w), num(s.r))));
    html += `<div class="card"><div class="ex-head"><div class="row" style="align-items:flex-start;gap:4px">${starBtn(it.ex)}<div><div class="ex-name">${esc(it.ex)}</div>
      ${it.plan ? `<div class="prev plan">Plan: ${esc(planText(it.plan))}</div>` : ""}
      <div class="prev">${prev ? `Last time (${esc(fshort(prev.date))}): ${esc(setsText(prev.sets))}` : "First time — no history yet"}</div>
      ${best && curBest > best ? `<div class="pr">New record: estimated 1RM ${fmt(curBest)} kg</div>` : ""}</div></div>
      <button class="danger" data-act="delex" data-i="${ii}">Remove</button></div>
      <div class="sets"><div class="lbls"><span>#</span><span>Weight, kg</span><span></span><span>Reps</span><span></span></div>`;
    it.sets.forEach((s, si) => {
      html += `<div class="set"><span class="n">${si+1}</span>
        <input inputmode="decimal" data-f="w" data-i="${ii}" data-s="${si}" value="${esc(s.w ?? "")}" placeholder="0">
        <span class="x">×</span>
        <input inputmode="numeric" data-f="r" data-i="${ii}" data-s="${si}" value="${esc(s.r ?? "")}" placeholder="0">
        <button class="del" data-act="delset" data-i="${ii}" data-s="${si}" aria-label="Delete set">×</button></div>`;
    });
    html += `</div><button class="ghost" data-act="addset" data-i="${ii}">+ Add set</button></div>`;
  });
  html += `<button class="big" data-act="pick" style="margin-top:4px">+ Add exercise</button>
    <div class="row" style="margin-top:12px"><button class="grow" data-act="cancel">Cancel</button>
    <button class="primary grow" data-act="finish" ${d.items.some(i => i.sets.some(s => num(s.r))) ? "" : "disabled"}>Save</button></div>
    ${d.items.length ? `<button class="ghost" data-act="draft2tpl" style="margin-top:8px;width:100%">Save as template</button>` : ""}`;
  v.innerHTML = html;
}

function renderTemplateEditor(v){
  const t = S.tdraft;
  $("#title").textContent = "Template";
  $("#subtitle").textContent = t.id ? "Edit template" : "New template — weights are optional";
  let html = `<div class="card"><label class="sub">Template name</label><input data-f="tname" maxlength="60" value="${esc(t.name || "")}" placeholder="e.g. Push day" style="margin-top:4px"></div>`;
  t.items.forEach((it, ii) => {
    html += `<div class="card"><div class="ex-head"><div class="row" style="align-items:flex-start;gap:4px">${starBtn(it.ex)}<div class="ex-name">${esc(it.ex)}</div></div>
      <div class="row" style="gap:0">${ii > 0 ? `<button class="ghost" data-act="tplup" data-i="${ii}" aria-label="Move up">↑</button>` : ""}<button class="danger" data-act="delex" data-i="${ii}">Remove</button></div></div>
      <div class="sets"><div class="lbls"><span>#</span><span>Weight, kg</span><span></span><span>Reps</span><span></span></div>`;
    it.sets.forEach((s, si) => {
      html += `<div class="set"><span class="n">${si+1}</span>
        <input inputmode="decimal" data-f="w" data-i="${ii}" data-s="${si}" value="${esc(s.w ?? "")}" placeholder="auto">
        <span class="x">×</span>
        <input inputmode="numeric" data-f="r" data-i="${ii}" data-s="${si}" value="${esc(s.r ?? "")}" placeholder="reps">
        <button class="del" data-act="delset" data-i="${ii}" data-s="${si}" aria-label="Delete set">×</button></div>`;
    });
    html += `</div><button class="ghost" data-act="addset" data-i="${ii}">+ Add set</button></div>`;
  });
  html += `<div class="prev" style="margin:4px 2px 10px">Leave weight empty (“auto”) and the app will fill in what you lifted last time.</div>
    <button class="big" data-act="pick">+ Add exercise</button>
    <div class="row" style="margin-top:12px"><button class="grow" data-act="tplcancel">Cancel</button>
    <button class="primary grow" data-act="tplsave">Save template</button></div>
    ${t.id ? `<button class="danger" data-act="tpldel" style="margin-top:8px;width:100%">Delete template</button>` : ""}`;

function backupNag(){
  const p = prefs();
  if (!workouts().length) return "";
  if (p.lastBackup && Date.now() - new Date(p.lastBackup) < 7 * 864e5) return "";
  return `<div class="status warn row" style="justify-content:space-between;margin:12px 0"><span>${p.lastBackup ? `Last backup ${ago(p.lastBackup)}` : "You haven't saved a backup yet"}</span><button class="ghost" data-act="backup" style="padding:4px 6px">Back up now</button></div>`;
}

function renderHistory(v){
  const ws = workouts();
  $("#subtitle").textContent = ws.length ? `${ws.length} workout${ws.length === 1 ? "" : "s"} in total` : "";
  const p = prefs();
  const backupRow = `<div class="card"><h2>Backup</h2><div class="sub" style="margin-bottom:8px">Your data lives only on this phone. Keep a backup file in iCloud Drive / Google Drive so you never lose it.<br><b>${p.lastBackup ? `Last backup: ${ago(p.lastBackup)}` : "No backup yet"}</b></div>
    <div class="row wrapr"><button class="grow" data-act="backup">Save backup</button><button class="grow" data-act="restore">Restore</button>${ws.length ? `<button class="grow" data-act="csv">Copy CSV</button>` : ""}</div>
    <label class="row" style="margin-top:12px;gap:10px;align-items:flex-start"><input type="checkbox" data-act="toggleauto" ${p.autoBackup ? "checked" : ""} style="width:auto;margin-top:3px"><span class="sub">Back up automatically after every saved workout — the save sheet opens by itself, you just pick where to keep the file</span></label>
    <input type="file" id="restoreFile" accept=".json,application/json" style="display:none"></div>`;
  if (!ws.length) { v.innerHTML = `<div class="empty">Your saved workouts will appear here.</div>` + backupRow; return; }
  let html = backupRow;
  ws.forEach(w => {
    const ton = w.items.reduce((a, i) => a + i.sets.reduce((b, s) => b + (s.w||0)*(s.r||0), 0), 0);
    html += `<div class="card"><div class="ex-head"><div><div class="ex-name">${esc(fdate(w.date))}</div>
      <div class="prev">${w.tpl ? esc(w.tpl) + " · " : ""}${w.items.length} exercise${w.items.length === 1 ? "" : "s"} · volume ${fmt(ton)} kg</div></div>
      <div class="row" style="gap:0"><button class="ghost" data-act="w2tpl" data-id="${w.id}" title="Save as template">+Tpl</button><button class="ghost" data-act="edit" data-id="${w.id}">Edit</button>
      <button class="danger" data-act="delw" data-id="${w.id}">Delete</button></div></div>
      ${w.items.map(i => `<div class="hist-ex">${isFav(i.ex) ? "★ " : ""}<b>${esc(i.ex)}:</b> ${esc(setsText(i.sets))}</div>`).join("")}</div>`;
  });
  v.innerHTML = html;
}

function sessionsFor(ex){
  return workouts().slice().reverse().map(w => {
    const it = w.items.find(i => i.ex === ex); if (!it || !it.sets.length) return null;
    let maxW = 0, maxWr = 0, best = 0, vol = 0, bestSet = null;
    it.sets.forEach(s => { const e = e1rm(s.w, s.r); vol += (s.w||0)*(s.r||0);
      if ((s.w||0) > maxW || ((s.w||0) === maxW && (s.r||0) > maxWr)) { maxW = s.w||0; maxWr = s.r||0; }
      if (e > best || !bestSet) { best = Math.max(best, e); bestSet = (e >= best) ? s : bestSet; } });
    return {date: w.date, maxW, maxWr, e1: best, vol, bestSet, reps: it.sets.reduce((a,s)=>a+(s.r||0),0)};
  }).filter(Boolean);
}

function renderProgress(v){
  const counts = useCounts();
  const exs = Object.keys(counts).sort((a,b) => counts[b] - counts[a]);
  $("#subtitle").textContent = "How your working weights are growing";
  if (!exs.length) { v.innerHTML = `<div class="empty">Save at least one workout and charts for each exercise will appear here.</div>`; return; }
  if (!S.progEx || !counts[S.progEx]) S.progEx = exs.find(isFav) || exs[0];
  const ss = sessionsFor(S.progEx);
  const bodyOnly = ss.every(s => !s.maxW);
  if (bodyOnly) S.progMetric = "reps"; else if (S.progMetric === "reps") S.progMetric = "e1rm";
  const pr = ss.reduce((a,s) => (s.maxW > a.maxW || (s.maxW === a.maxW && s.maxWr > a.maxWr)) ? s : a, ss[0]);
  const best = ss.reduce((a,s) => s.e1 > a.e1 ? s : a, ss[0]);
  const M = {e1rm: ["Est. 1RM", s => s.e1, "kg"], max: ["Top weight", s => s.maxW, "kg"], vol: ["Volume", s => s.vol, "kg"], reps: ["Reps", s => s.reps, "reps"]};
  const metrics = bodyOnly ? ["reps"] : ["e1rm","max","vol"];
  const favList = exs.filter(isFav), rest = exs.filter(e => !isFav(e));
  const opt = e => `<option value="${esc(e)}" ${e === S.progEx ? "selected" : ""}>${esc(e)}</option>`;
  v.innerHTML = `<div class="card"><div class="row">${starBtn(S.progEx)}<select data-f="progEx" class="grow">
      ${favList.length ? `<optgroup label="★ Favorites">${favList.map(opt).join("")}</optgroup><optgroup label="Other">${rest.map(opt).join("")}</optgroup>` : exs.map(opt).join("")}
    </select></div></div>
    <div class="tiles">
      ${bodyOnly ? `<div class="tile"><div class="k">Best set</div><div class="v">${Math.max(...ss.map(s=>s.bestSet ? s.bestSet.r : 0))}</div><div class="d">reps</div></div>`
      : `<div class="tile"><div class="k">Top weight</div><div class="v">${fmt(pr.maxW)}</div><div class="d">${fmt(pr.maxW)}×${pr.maxWr} · ${esc(fshort(pr.date))}</div></div>
      <div class="tile"><div class="k">Best est. 1RM</div><div class="v">${fmt(best.e1)}</div><div class="d">from ${fmt(best.bestSet.w)}×${best.bestSet.r}</div></div>`}
      <div class="tile"><div class="k">Sessions</div><div class="v">${ss.length}</div><div class="d">since ${esc(fshort(ss[0].date))}</div></div>
    </div>
    <div class="card">
      ${metrics.length > 1 ? `<div class="seg">${metrics.map(k => `<button data-act="metric" data-m="${k}" class="${S.progMetric===k?"on":""}">${M[k][0]}</button>`).join("")}</div>` : `<h2>Total reps per session</h2>`}
      ${ss.length < 2 ? `<div class="empty">You need at least two sessions with this exercise to see a chart.</div>` : `<div class="svgchart" id="chart" role="img" aria-label="Progress chart"></div>`}
      ${S.progMetric === "e1rm" && !bodyOnly ? `<div class="prev" style="margin-top:8px">Estimated 1RM is the weight you could lift for a single rep (Epley formula). It lets you compare sets with different rep counts.</div>` : ""}
    </div>
    <div class="card"><h2>Recent sessions</h2><table><thead><tr><th>Date</th><th>Best set</th><th class="num">${bodyOnly ? "Reps" : "Volume, kg"}</th></tr></thead><tbody>
      ${ss.slice(-10).reverse().map(s => `<tr><td>${esc(fshort(s.date))}</td><td>${s.bestSet ? `${fmt(s.bestSet.w||0)}×${s.bestSet.r||0}` : "—"}</td><td class="num">${bodyOnly ? s.reps : fmt(s.vol)}</td></tr>`).join("")}
    </tbody></table></div>`;
  if (ss.length >= 2) drawChart(ss.map(s => fshort(s.date)), ss.map(M[S.progMetric][1]), M[S.progMetric][2], true);
}

function renderWeight(v){
  const list = bws();
  $("#subtitle").textContent = "One entry per day — a new one replaces that day's entry";
  const last = list[list.length - 1];
  let html = `<div class="card"><div class="row"><input type="date" id="bwDate" value="${today()}" style="flex:1.2">
    <input id="bwKg" inputmode="decimal" placeholder="kg" style="flex:1"><button class="primary" data-act="bwsave">Save</button></div></div>`;
  if (!list.length) { v.innerHTML = html + `<div class="empty">Weigh yourself in the morning before eating, at least once a week, so the trend is honest.</div>`; return; }
  const cut = new Date(); cut.setDate(cut.getDate() - 30); const cutIso = cut.toISOString().slice(0,10);
  const base = list.filter(b => b.date <= cutIso).pop() || list[0];
  const diff = last.kg - base.kg;
  html += `<div class="tiles"><div class="tile"><div class="k">Current</div><div class="v">${fmt(last.kg)}</div><div class="d">${esc(fshort(last.date))}</div></div>
    <div class="tile"><div class="k">Last 30 days</div><div class="v">${diff > 0 ? "+" : ""}${fmt(diff)}</div><div class="d">from ${fmt(base.kg)} kg</div></div>
    <div class="tile"><div class="k">Min / max</div><div class="v" style="font-size:16px">${fmt(Math.min(...list.map(b=>b.kg)))} / ${fmt(Math.max(...list.map(b=>b.kg)))}</div><div class="d">${list.length} entries</div></div></div>`;
  html += list.length >= 2 ? `<div class="card"><div class="svgchart" id="chart" role="img" aria-label="Body weight chart"></div></div>` : "";
  html += `<div class="card"><table><thead><tr><th>Date</th><th class="num">Weight, kg</th><th></th></tr></thead><tbody>
    ${list.slice(-20).reverse().map(b => `<tr><td>${esc(fdate(b.date))}</td><td class="num">${fmt(b.kg)}</td><td class="num"><button class="danger" data-act="delbw" data-id="${b.id}">Delete</button></td></tr>`).join("")}</tbody></table></div>`;
  v.innerHTML = html;
  if (list.length >= 2) drawChart(list.map(b => fshort(b.date)), list.map(b => b.kg), "kg", true);
}

function niceTicks(lo, hi, n){
  if (lo === hi) { lo -= 1; hi += 1; }
  const raw = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1,2,2.5,5,10].map(m => m * mag).find(s => s >= raw);
  const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step, t = [];
  for (let v = a; v <= b + step / 2; v += step) t.push(+v.toFixed(6));
  return t;
}
function drawChart(labels, data, unit, loose){
  const box = $("#chart"); if (!box) return;
  const W = Math.max(280, box.clientWidth || 340), H = 220, L = 40, R = 10, T = 10, B = 26;
  let lo = Math.min(...data), hi = Math.max(...data);
  if (!loose) lo = 0; else { const pad = (hi - lo) * 0.15 || 1; lo -= pad; hi += pad; }
  const ticks = niceTicks(lo, hi, 4), y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const X = i => L + (data.length === 1 ? (W - L - R) / 2 : i * (W - L - R) / (data.length - 1));
  const Y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  ticks.forEach(t => { svg += `<line x1="${L}" x2="${W - R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-width="1"/>
    <text x="${L - 8}" y="${Y(t) + 4}" text-anchor="end" font-size="12" fill="var(--ink2)">${fmt(t)}</text>`; });
  const every = Math.max(1, Math.ceil(data.length / 5));
  labels.forEach((l, i) => { if (i % every === 0 || i === data.length - 1) {
    if (i !== data.length - 1 && data.length - 1 - i < every * 0.6) return;
    svg += `<text x="${X(i)}" y="${H - 8}" text-anchor="middle" font-size="12" fill="var(--ink2)">${esc(l)}</text>`; } });
  svg += `<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${data.map((v, i) => `${X(i)},${Y(v)}`).join(" ")}"/>`;
  const showPts = data.length <= 40;
  data.forEach((v, i) => {
    if (showPts) svg += `<circle cx="${X(i)}" cy="${Y(v)}" r="4.5" fill="var(--accent)" stroke="var(--card)" stroke-width="2"/>`;
    const w = data.length > 1 ? (W - L - R) / (data.length - 1) : W;
    svg += `<rect class="hitpt" data-i="${i}" x="${X(i) - w / 2}" y="${T}" width="${w}" height="${H - T - B}" fill="transparent"/>`;
  });
  svg += `<circle id="hl" r="7" fill="none" stroke="var(--accent)" stroke-width="2" style="display:none"/></svg>`;
  const lastI = data.length - 1;
  box.innerHTML = svg + `<div class="cap" id="cap">${esc(labels[lastI])}: <b>${fmt(data[lastI])} ${unit}</b></div>`;
  const hl = box.querySelector("#hl"), cap = box.querySelector("#cap");
  const show = i => { hl.style.display = ""; hl.setAttribute("cx", X(i)); hl.setAttribute("cy", Y(data[i])); cap.innerHTML = `${esc(labels[i])}: <b>${fmt(data[i])} ${unit}</b>`; };
  box.querySelectorAll(".hitpt").forEach(r => { r.addEventListener("pointerenter", () => show(+r.dataset.i)); r.addEventListener("click", () => show(+r.dataset.i)); });
}

/* ---------- backup ---------- */
async function exportBackup(auto){
  const body = JSON.stringify({app: "workout-log", version: 1, exported: new Date().toISOString(), docs: Object.fromEntries(S.docs)});
  const name = `workout-log-backup-${today()}.json`;
  try {
    const file = new File([body], name, {type: "application/json"});
    if (navigator.canShare && navigator.canShare({files: [file]})) { await navigator.share({files: [file], title: "Workout Log backup"}); markBackup(); return "ok"; }
  } catch (e) { if (e && e.name === "AbortError") return "cancel"; if (auto) return "blocked"; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([body], {type: "application/json"})); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  markBackup(); return "ok";
}
function markBackup(){ setPref("lastBackup", new Date().toISOString()); if (S.tab === "history" || S.tab === "log") render(); }
function backupSheet(title){
  $("#modalRoot").innerHTML = `<div class="modal" data-act="close"><div class="sheet"><div style="font-size:17px;font-weight:600">${esc(title)}</div>
    <div class="sub" style="margin:6px 0 14px">Save a backup file so your history is safe.</div>
    <button class="primary big" id="bkNow">Save backup</button><button class="big" data-act="close" style="margin-top:8px">Not now</button></div></div>`;
  $("#bkNow").onclick = () => { closeModal(); exportBackup(); };
}
function importBackup(file){
  const rd = new FileReader();
  rd.onload = () => {
    let data; try { data = JSON.parse(rd.result); } catch { return toast("That file isn't a valid backup"); }
    if (!data || data.app !== "workout-log" || typeof data.docs !== "object") return toast("That file isn't a Workout Log backup");
    const n = Object.values(data.docs).filter(d => d && d.kind === "workout").length;
    confirmBox(`Restore ${n} workout${n === 1 ? "" : "s"} from this backup? Entries with the same date and ID will be overwritten; everything else is kept.`, "Restore", () => {
      for (const [id, d] of Object.entries(data.docs)) {
        if (!d || typeof d !== "object") continue;
        if (id === "settings") {
          const cur = settings();
          S.docs.set("settings", {...cur, kind: "settings", custom: [...new Set([...(cur.custom||[]), ...(d.custom||[])])], favorites: [...new Set([...(cur.favorites||[]), ...(d.favorites||[])])]});
        } else S.docs.set(id, d);
      }
      persistLocal(); render(); toast("Backup restored");
    });
  };
  rd.readAsText(file);
}

/* ---------- modals ---------- */
function closeModal(){ $("#modalRoot").innerHTML = ""; }
function confirmBox(text, okLabel, onOk){
  $("#modalRoot").innerHTML = `<div class="modal" data-act="close"><div class="sheet">
    <div style="font-size:17px">${esc(text)}</div><div class="row" style="margin-top:16px">
    <button class="grow" data-act="close">Cancel</button><button class="primary grow" id="okBtn">${esc(okLabel)}</button></div></div></div>`;
  $("#okBtn").onclick = () => { closeModal(); onOk(); };
}
function nameBox(title, initial, okLabel, onOk){
  $("#modalRoot").innerHTML = `<div class="modal" data-act="close"><div class="sheet"><div style="font-size:17px;margin-bottom:10px">${esc(title)}</div>
    <input id="nameIn" maxlength="60" value="${esc(initial)}"><div class="row" style="margin-top:16px">
    <button class="grow" data-act="close">Cancel</button><button class="primary grow" id="okBtn">${esc(okLabel)}</button></div></div></div>`;
  const inp = $("#nameIn"); setTimeout(() => { inp.focus(); inp.select(); }, 50);
  const ok = () => { const v = inp.value.trim(); if (!v) return toast("Enter a name"); closeModal(); onOk(v); };
  $("#okBtn").onclick = ok; inp.addEventListener("keydown", e => { if (e.key === "Enter") ok(); });
}
function openPicker(){
  $("#modalRoot").innerHTML = `<div class="modal" data-act="close"><div class="sheet">
    <div class="row"><input id="q" placeholder="Search or create an exercise" autocomplete="off"><button data-act="close">Close</button></div>
    <div class="list" id="plist"></div></div></div>`;
  const q = $("#q"); q.addEventListener("input", fillPicker); fillPicker(); setTimeout(() => q.focus(), 50);
}
function fillPicker(){
  const qEl = $("#q"); if (!qEl) return;
  const q = (qEl.value || "").trim(), ql = q.toLowerCase();
  const {used, custom} = allExercises();
  const match = e => !ql || e.toLowerCase().includes(ql);
  const counts = useCounts();
  const row = e => `<div class="pickrow"><button class="pick" data-act="addex" data-ex="${esc(e)}">${esc(e)}${counts[e] ? `<small>${counts[e]}×</small>` : ""}</button>${starBtn(e)}</div>`;
  let html = "";
  const exact = [...Object.values(PRESETS).flat(), ...custom].some(e => e.toLowerCase() === ql);
  if (q && !exact) html += `<div class="pickrow"><button class="pick" data-act="addex" data-ex="${esc(q)}"><b>+ Create “${esc(q)}”</b></button></div>`;
  const fav = favs().filter(match);
  if (fav.length) html += `<div class="grp">★ Favorites</div>` + fav.map(row).join("");
  const recent = [...used].filter(e => match(e) && !isFav(e)).sort((a,b) => counts[b]-counts[a]).slice(0, 6);
  if (recent.length && !ql) html += `<div class="grp">Frequent</div>` + recent.map(row).join("");
  const mine = custom.filter(match);
  if (mine.length) html += `<div class="grp">My exercises</div>` + mine.map(row).join("");
  for (const [g, list] of Object.entries(PRESETS)) {
    const l = list.filter(match); if (!l.length) continue;
    html += `<div class="grp">${esc(g)}</div>` + l.map(row).join("");
  }
  const list = $("#plist"), top = list.scrollTop;
  list.innerHTML = html || `<div class="empty">Nothing found</div>`;
  list.scrollTop = top;
}

/* ---------- actions ---------- */
function rememberCustom(ex){
  const preset = new Set(Object.values(PRESETS).flat());
  if (!preset.has(ex) && !customEx().includes(ex)) saveSettings(s => ({custom: [...(s.custom || []), ex]}));
}
function addExercise(ex, keepOpen){
  ex = ex.trim().slice(0, 80); if (!ex) return;
  if (S.tdraft) {
    const t = S.tdraft;
    if (t.items.some(i => i.ex === ex)) { toast("Already in this template"); return; }
    t.items.push({ex, sets: [{w: null, r: null}, {w: null, r: null}, {w: null, r: null}]});
    setTDraft(t); if (!keepOpen) closeModal(); render(); rememberCustom(ex); return;
  }
  const d = ensureDraft();
  if (d.items.some(i => i.ex === ex)) { toast("Already in this workout"); return; }
  const prev = lastSession(ex, d.id);
  d.items.push({ex, sets: prev ? prev.sets.map(s => ({w: s.w, r: s.r})) : [{w: null, r: null}]});
  setDraft(d); if (!keepOpen) closeModal(); render();
  rememberCustom(ex);
}
function toggleFav(ex){
  const on = isFav(ex);
  saveSettings(s => ({favorites: on ? (s.favorites || []).filter(e => e !== ex) : [...(s.favorites || []), ex]}));
  rememberCustom(ex);
  toast(on ? "Removed from favorites" : "Added to favorites ★");
}
async function finish(){
  const d = S.draft;
  const items = d.items.map(i => ({ex: i.ex, sets: i.sets.map(s => ({w: num(s.w) || 0, r: Math.round(num(s.r) || 0)})).filter(s => s.r > 0)})).filter(i => i.sets.length);
  if (!items.length) return toast("Fill in at least one set");
  const id = d.id || ("w_" + uid());
  const old = S.docs.get(id);
  const prBefore = {}; items.forEach(i => prBefore[i.ex] = bestE1(i.ex, id));
  try { await save(id, {kind: "workout", date: d.date || today(), items, ...(d.tplName || old?.tpl ? {tpl: d.tplName || old.tpl} : {}), created: old?.created || new Date().toISOString()}); }
  catch { render(); return; }
  const prs = items.filter(i => prBefore[i.ex] && Math.max(...i.sets.map(s => e1rm(s.w, s.r))) > prBefore[i.ex]).map(i => i.ex);
  setDraft(null); S.tab = "history"; render();
  const msg = prs.length ? `Saved. New record: ${prs.join(", ")} 🎉` : "Workout saved";
  toast(msg);
  if (prefs().autoBackup) { const r = await exportBackup(true); if (r === "blocked") backupSheet(msg); }
}
const cleanSets = sets => sets.map(s => { const w = num(s.w), r = num(s.r); return {w: w || null, r: r ? Math.round(r) : null}; });
async function saveTemplate(){
  const t = S.tdraft;
  const name = (t.name || "").trim();
  if (!name) return toast("Give the template a name");
  if (!t.items.length) return toast("Add at least one exercise");
  const id = t.id || ("t_" + uid());
  const old = S.docs.get(id);
  try { await save(id, {kind: "template", name: name.slice(0, 60), items: t.items.map(i => ({ex: i.ex, sets: cleanSets(i.sets)})), created: old?.created || new Date().toISOString()}); }
  catch { return; }
  setTDraft(null); render(); toast("Template saved");
}
function templateFrom(items, defName){
  nameBox("Save as template", defName, "Save", async name => {
    const id = "t_" + uid();
    try { await save(id, {kind: "template", name, items: items.map(i => ({ex: i.ex, sets: cleanSets(i.sets)})), created: new Date().toISOString()}); toast(`Template “${name}” saved`); } catch {}
  });
}
function startFromTemplate(t){
  const go = () => {
    setDraft({date: today(), tplName: t.name, items: t.items.map(it => {
      const prev = lastSession(it.ex);
      const ps = k => prev ? (prev.sets[k] || prev.sets[prev.sets.length - 1]) : null;
      return {ex: it.ex, plan: it.sets.map(s => ({w: s.w, r: s.r})),
        sets: it.sets.map((s, k) => ({w: s.w ?? ps(k)?.w ?? null, r: s.r ?? ps(k)?.r ?? null}))};
    })});
    S.tab = "log"; render(); window.scrollTo(0, 0);
  };
  S.draft ? confirmBox("You have an unfinished workout. Replace it with this template?", "Replace", go) : go();
}
function toCSV(){
  const rows = [["Date","Exercise","Set","Weight (kg)","Reps"]];
  workouts().slice().reverse().forEach(w => w.items.forEach(i => i.sets.forEach((s, k) => rows.push([w.date, i.ex, k+1, s.w, s.r]))));
  bws().forEach(b => rows.push([b.date, "Body weight", "", b.kg, ""]));
  return rows.map(r => r.map(c => /[",;\n]/.test(String(c)) ? `"${String(c).replace(/"/g,'""')}"` : c).join(",")).join("\n");
}
function startWith(exList){
  setDraft({date: today(), items: []});
  exList.forEach(ex => { const prev = lastSession(ex); S.draft.items.push({ex, sets: prev ? prev.sets.map(s => ({w: s.w, r: s.r})) : [{w: null, r: null}]}); });
  setDraft(S.draft); render();
}

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-act],[data-tab]"); if (!t) return;
  if (t.dataset.tab) { S.tab = t.dataset.tab; render(); window.scrollTo(0,0); return; }
  const a = t.dataset.act, i = +t.dataset.i, s = +t.dataset.s;
  const d = active();
  switch (a) {
    case "close": if (e.target === t || t.tagName === "BUTTON") closeModal(); break;
    case "start": setTDraft(null); ensureDraft(); render(); openPicker(); break;
    case "quick": startWith([t.dataset.ex]); break;
    case "quickall": startWith(favs()); break;
    case "repeat": { const w = workouts().find(x => x.id === t.dataset.id); if (w) { setDraft({date: today(), items: w.items.map(it => ({ex: it.ex, sets: it.sets.map(z => ({...z}))}))}); render(); } break; }
    case "pick": openPicker(); break;
    case "addex": addExercise(t.dataset.ex); break;
    case "fav": e.stopPropagation(); toggleFav(t.dataset.ex); break;
    case "addset": { const it = d.items[i]; const l = it.sets[it.sets.length - 1]; it.sets.push(l ? {w: l.w, r: l.r} : {w: null, r: null}); saveActive(); render(); break; }
    case "delset": d.items[i].sets.splice(s, 1); if (!d.items[i].sets.length) d.items.splice(i, 1); saveActive(); render(); break;
    case "delex": confirmBox(`Remove “${d.items[i].ex}” from this ${S.tdraft ? "template" : "workout"}?`, "Remove", () => { d.items.splice(i, 1); saveActive(); render(); }); break;
    case "tplup": { const [x] = d.items.splice(i, 1); d.items.splice(i - 1, 0, x); saveActive(); render(); break; }
    case "newtpl": setTDraft({name: "", items: []}); S.tab = "log"; render(); window.scrollTo(0, 0); break;
    case "edittpl": { const tp = templates().find(x => x.id === t.dataset.id); if (!tp) break;
      setTDraft({id: tp.id, name: tp.name, items: tp.items.map(it => ({ex: it.ex, sets: it.sets.map(z => ({...z}))}))}); render(); window.scrollTo(0, 0); break; }
    case "tplcancel": confirmBox("Discard changes to this template?", "Discard", () => { setTDraft(null); render(); }); break;
    case "tplsave": await saveTemplate(); break;
    case "tpldel": { const id = S.tdraft.id; confirmBox("Delete this template? Your saved workouts are not affected.", "Delete", async () => { await remove(id); setTDraft(null); render(); toast("Template deleted"); }); break; }
    case "starttpl": { const tp = templates().find(x => x.id === t.dataset.id); if (tp) startFromTemplate(tp); break; }
    case "draft2tpl": templateFrom(S.draft.items, S.draft.tplName ? S.draft.tplName + " (copy)" : `Workout ${fshort(S.draft.date || today())}`); break;
    case "w2tpl": { const w = workouts().find(x => x.id === t.dataset.id); if (w) templateFrom(w.items, w.tpl || `Workout ${fshort(w.date)}`); break; }
    case "toggleauto": setPref("autoBackup", t.checked); toast(t.checked ? "Auto-backup on" : "Auto-backup off"); break;
    case "cancel": confirmBox(d.id ? "Discard your changes?" : "Discard this workout? The sets you entered won't be saved.", "Discard", () => { setDraft(null); render(); }); break;
    case "finish": t.disabled = true; await finish(); break;
    case "edit": { const w = workouts().find(x => x.id === t.dataset.id); if (!w) break;
      const go = () => { setDraft({id: w.id, date: w.date, tplName: w.tpl, items: w.items.map(it => ({ex: it.ex, sets: it.sets.map(z => ({...z}))}))}); S.tab = "log"; render(); window.scrollTo(0,0); };
      S.draft ? confirmBox("You have an unfinished workout. Replace it with this one?", "Replace", go) : go(); break; }
    case "delw": confirmBox("Delete this workout?", "Delete", () => remove(t.dataset.id)); break;
    case "metric": S.progMetric = t.dataset.m; render(); break;
    case "csv": try { await navigator.clipboard.writeText(toCSV()); toast("CSV copied — paste it into Excel or Google Sheets"); } catch { toast("Couldn't copy"); } break;
    case "backup": exportBackup(); break;
    case "restore": { const f = $("#restoreFile"); f.value = ""; f.onchange = () => f.files[0] && importBackup(f.files[0]); f.click(); break; }
    case "bwsave": { const kg = num($("#bwKg").value), date = $("#bwDate").value || today();
      if (!kg || kg < 20 || kg > 400) return toast("Enter your weight in kg");
      try { await save("bw_" + date, {kind: "bw", date, kg: Math.round(kg * 10) / 10}); toast("Saved"); } catch {} break; }
    case "delbw": confirmBox("Delete this weight entry?", "Delete", () => remove(t.dataset.id)); break;
  }
});
document.addEventListener("input", e => {
  const f = e.target.dataset.f; if (!f || f === "progEx") return;
  const d = active(); if (!d) return;
  if (f === "date") d.date = e.target.value;
  else if (f === "tname") d.name = e.target.value;
  else { const set = d.items[+e.target.dataset.i].sets[+e.target.dataset.s]; set[f] = e.target.value; }
  saveActive();
  const btn = document.querySelector('[data-act="finish"]');
  if (btn) btn.disabled = !d.items.some(i => i.sets.some(s => num(s.r)));
});
document.addEventListener("change", e => { if (e.target.dataset.f === "progEx") { S.progEx = e.target.value; render(); } });

render();
initStore();
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
})();
</script>
